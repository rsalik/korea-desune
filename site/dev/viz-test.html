<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viz dev harness</title>
<style>
  :root {
    --paper:#F2F4F0; --card:#FAFBF8; --ink:#1B211F; --muted:#5A6561; --line:#D5DBD3;
    --celadon:#4C8273; --celadon-soft:#DCEAE4; --maple:#BF3F2B; --maple-soft:#F6DED8;
    --ginkgo:#C98F12; --ginkgo-soft:#F7ECCF; --sea:#2E5C86; --sea-soft:#DCE6EF; --land:#E6E9E2;
    --font-display:"Hahmlet", "Noto Serif KR", Georgia, serif;
    --font-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#111614; --card:#171D1B; --ink:#E6EBE7; --muted:#9AA6A1; --line:#29322F;
      --celadon:#7DB7A6; --celadon-soft:#1D2D28; --maple:#E4644F; --maple-soft:#3A2420;
      --ginkgo:#E3B23F; --ginkgo-soft:#352C16; --sea:#7FA6CF; --sea-soft:#1A2633; --land:#1E2522;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper:#111614; --card:#171D1B; --ink:#E6EBE7; --muted:#9AA6A1; --line:#29322F;
    --celadon:#7DB7A6; --celadon-soft:#1D2D28; --maple:#E4644F; --maple-soft:#3A2420;
    --ginkgo:#E3B23F; --ginkgo-soft:#352C16; --sea:#7FA6CF; --sea-soft:#1A2633; --land:#1E2522;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--font-body); }
  .wrap { max-width: 1180px; margin-inline: auto; padding-inline: 16px; padding-block: 16px 48px; }
  h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 1.5rem 0 .5rem; }
  h1 { font-size: 1.9rem; margin-top: 0; }
  h2 { font-size: 1.4rem; }
  .tools { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; margin: .5rem 0 .75rem; }
  .tools label { font-size: .9rem; }
  select, button { max-width: 100%; font: inherit; font-size: .9rem; padding: .25rem .5rem; color: var(--ink); background: var(--card); border: 1px solid var(--line); }
  #map { width: 100%; height: 520px; border: 1px solid var(--line); }
  @media (max-width: 700px) { #map { height: 60vh; } }
  #log { font: .8rem/1.4 var(--font-mono); color: var(--muted); margin: .4rem 0 0; min-height: 1.4em; }
</style>
<link rel="stylesheet" href="../viz.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="../data.js"></script>
<script src="../geo.js"></script>
<script src="../viz.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Viz dev harness</h1>

  <h2>Map</h2>
  <div class="tools">
    <label for="day-select">Focus day</label>
    <select id="day-select"></select>
    <label for="opt-select">Option</label>
    <select id="opt-select"></select>
    <button type="button" id="twice">setOption twice</button>
    <button type="button" id="theme-toggle">Toggle theme</button>
  </div>
  <div id="map"></div>
  <p id="log" aria-live="polite"></p>

  <h2>Autumn calendar: foliage</h2>
  <div id="foliage"></div>

  <h2>Events strip</h2>
  <div id="events"></div>
</div>

<script>
(function () {
  const T = window.TRIP;
  let option = T.options[0];
  const q = new URLSearchParams(location.search);
  const daySel = document.getElementById('day-select');
  const optSel = document.getElementById('opt-select');
  const log = document.getElementById('log');

  Viz.onPin = (date, idx) => { log.textContent = 'onPin(' + date + ', ' + idx + ')'; };

  function fillDays() {
    daySel.replaceChildren();
    const w = document.createElement('option'); w.value = ''; w.textContent = 'Whole trip'; daySel.appendChild(w);
    option.days.forEach((d) => {
      const o = document.createElement('option'); o.value = d.date; o.textContent = d.dow + ' ' + d.date.slice(5) + ' ' + d.base; daySel.appendChild(o);
    });
  }
  function fillOptions() {
    optSel.replaceChildren();
    T.options.forEach((o) => { const e = document.createElement('option'); e.value = o.id; e.textContent = o.id + ': ' + o.name; optSel.appendChild(e); });
  }
  function renderCharts() {
    Viz.renderFoliage(document.getElementById('foliage'), option);
    Viz.renderEvents(document.getElementById('events'), option);
  }
  function choose(o) {
    option = o;
    fillDays();
    Viz.setOption(option);
    renderCharts();
  }

  fillOptions();
  fillDays();
  Viz.initMap(document.getElementById('map'));
  choose(option);

  daySel.addEventListener('change', () => Viz.focusDay(daySel.value || null));
  optSel.addEventListener('change', () => choose(T.options.find((o) => o.id === optSel.value)));
  document.getElementById('twice').addEventListener('click', () => { Viz.setOption(option); Viz.setOption(option); });
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const r = document.documentElement;
    r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  // auto focus: ?day=YYYY-MM-DD, otherwise the 4th day; ?day=none for the whole-trip view
  const want = q.get('day');
  const date = want === 'none' ? null : (want || (option.days[3] && option.days[3].date));
  if (date) { daySel.value = date; Viz.focusDay(date); }
  window.__viz = Viz;
})();
</script>
</body>
</html>
